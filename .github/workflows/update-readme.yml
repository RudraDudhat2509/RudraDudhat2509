name: update readme

on:
  schedule:
    - cron: '23 5 * * *'   # daily 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: refresh upstream contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_oss_prs.py
      - name: refresh selected work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_work_projects.py
      - name: redraw banner
        # The banner stamps the merged-PR count into the artwork, so it has to
        # be regenerated whenever that count moves.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_dossier.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --staged --quiet || (git commit -m "chore: refresh readme" && git push)
